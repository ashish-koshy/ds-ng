<div class="ds-layout">
  <aside class="ds-sidebar">
    <div class="sidebar-body">
      <div class="sidebar-header d-flex align-items-center gap-2">
        <a routerLink="/" style="color: #64748b; text-decoration: none"
          ><mat-icon>arrow_back</mat-icon></a
        >
        <h1>Stack</h1>
        <span class="badge-label">LIFO</span>
      </div>

      <div class="sidebar-section">
        <div class="section-label">Controls</div>
        <div class="sidebar-controls">
          <input
            class="sidebar-input"
            type="number"
            placeholder="Value"
            [(ngModel)]="inputValue"
          />
          <div class="controls-row">
            <button class="sidebar-btn primary" (click)="push()">
              <mat-icon>arrow_upward</mat-icon> Push
            </button>
            <button class="sidebar-btn" (click)="pop()">
              <mat-icon>arrow_downward</mat-icon> Pop
            </button>
            <button class="sidebar-btn" (click)="peek()">
              <mat-icon>visibility</mat-icon> Peek
            </button>
            <button
              class="sidebar-btn icon-only"
              (click)="reset()"
              title="Reset"
            >
              <mat-icon>refresh</mat-icon>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="sidebar-footer">
      @if (message()) {
        <div class="msg-banner" style="margin-bottom: 10px">
          {{ message() }}
        </div>
      }
      <div class="section-label">Complexity</div>
      <div class="complexity-grid">
        <div class="complexity-chip">
          <span class="chip-label">Push</span
          ><span class="chip-value green">O(1)</span>
        </div>
        <div class="complexity-chip">
          <span class="chip-label">Pop</span
          ><span class="chip-value green">O(1)</span>
        </div>
        <div class="complexity-chip">
          <span class="chip-label">Peek</span
          ><span class="chip-value green">O(1)</span>
        </div>
        <div class="complexity-chip">
          <span class="chip-label">Search</span
          ><span class="chip-value amber">O(n)</span>
        </div>
      </div>
    </div>
  </aside>

  <div class="ds-canvas-area">
    <ds-zoom-canvas>
      <div class="stack-wrapper">
        <div class="stack-container">
          @if (stack().length === 0) {
            <div class="empty-state text-center py-4">Stack is empty</div>
          }
          @for (item of stack(); track $index; let last = $last) {
            <div
              class="stack-item d-flex align-items-center justify-content-between px-3"
              [class.top-item]="last"
              [class.top-highlighted]="last && topHighlight()"
            >
              <span class="item-value">{{ item }}</span>
              @if (last) {
                <span class="top-label">TOP</span>
              }
            </div>
          }
        </div>
        <div class="stack-base"></div>
      </div>
    </ds-zoom-canvas>
  </div>
</div>
